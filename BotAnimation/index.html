<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Koji - Learning Assistant</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .assistant-container {
            text-align: center;
            position: relative;
            cursor: pointer;
        }

        .speech-bubble {
            background: white;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 70px;
            position: relative;
            max-width: 300px;
            transform-origin: bottom center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }

        .message {
            font-size: 1.2em;
            color: #333;
            margin: 0;
        }

        .bot {
            width: 220px;
            height: 220px;
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .bot:hover {
            transform: scale(1.05);
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: #60A5FA;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(-2deg); }
            75% { transform: translateY(15px) rotate(2deg); }
        }

        @keyframes blink {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        @keyframes antenna-glow {
            0%, 100% { filter: drop-shadow(0 0 3px rgba(96, 165, 250, 0.5)); }
            50% { filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.8)); }
        }

        @keyframes particle-float {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }

        .bot-container {
            animation: float 4s ease-in-out infinite;
            position: relative;
        }

        .eyes {
            animation: blink 2.5s infinite;
            transform-origin: center;
        }

        .antenna {
            animation: antenna-glow 2s infinite;
        }

        .arms {
            transition: transform 0.3s ease;
            
        }

        .bot-container:hover .left-arm {
            transition: transform 1.5s ease-in-out;
            transform: rotate(-20deg);
            transform-origin: 30% 50%;
        }

        .bot-container:hover .right-arm {
            transition: transform 1.5s ease-in-out;
            transform: rotate(20deg);
            transform-origin: 70% 50%;
        }

        .messages {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bot-container:hover .messages {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="assistant-container">
        <div class="speech-bubble">
            <p class="message">Hey there! Click me or hover over me to see what I can do! 🚀</p>
        </div>
        <div class="bot-container">
            <div class="messages">✨ Let's learn together! ✨</div>
            <div class="particles"></div>
            <svg class="bot" viewBox="0 0 200 200" fill="none">
                <!-- Antenna -->
                <g class="antenna">
                    <line x1="100" y1="30" x2="100" y2="10" stroke="#60A5FA" stroke-width="4"/>
                    <circle cx="100" cy="5" r="5" fill="#60A5FA"/>
                </g>
                
                <!-- Bot Head -->
                <circle cx="100" cy="100" r="70" fill="#60A5FA"/>
                
                <!-- Eyes -->
                <g class="eyes">
                    <circle cx="75" cy="90" r="10" fill="white"/>
                    <circle cx="125" cy="90" r="10" fill="white"/>
                    <circle cx="75" cy="90" r="5" fill="#333"/>
                    <circle cx="125" cy="90" r="5" fill="#333"/>
                </g>
                
                <!-- Smile -->
                <path d="M70 115 Q100 140 130 115" stroke="white" stroke-width="5" stroke-linecap="round"/>
                
                <!-- Arms -->
                <g class="arms">
                    <path class="left-arm" d="M30 120 Q20 140 30 160" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>
                    <path class="right-arm" d="M170 120 Q180 140 170 160" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>
                </g>
            </svg>
        </div>
    </div>

    <script>
        const container = document.querySelector('.bot-container');
        const particles = document.querySelector('.particles');
        const messages = [
            "Let's learn something new! 📚",
            "I'm here to help! 💡",
            "Ready for a challenge? 🎯",
            "Knowledge is power! ⚡",
            "You're doing great! 🌟"
        ];

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 8 + 4;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            const tx = (Math.random() - 0.5) * 100;
            const ty = (Math.random() - 0.5) * 100;
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);
            
            particle.style.animation = 'particle-float 1s forwards';
            
            particles.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }

        function emitParticles(e) {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for (let i = 0; i < 8; i++) {
                createParticle(x, y);
            }
        }

        let messageIndex = 0;
        function changeMessage() {
            const messageElement = document.querySelector('.message');
            messageElement.style.opacity = 0;
            
            setTimeout(() => {
                messageElement.textContent = messages[messageIndex];
                messageElement.style.opacity = 1;
                messageIndex = (messageIndex + 1) % messages.length;
            }, 300);
        }

        container.addEventListener('mousemove', emitParticles);
        container.addEventListener('click', () => {
            changeMessage();
            emitParticles(event);
            container.style.transform = 'scale(0.95)';
            setTimeout(() => container.style.transform = 'scale(1)', 150);
        });
    </script>
</body>
</html>
