<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .dropDbImg {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: red;
            transition: filter 0.3s ease;
            filter: invert(1) hue-rotate(32deg) brightness(90%);
        }

        .dropDbImg:hover {
            filter: invert(0) hue-rotate(0deg);
        }
    </style>
    <img src="dropDB.png" class="dropDbImg">
</body>

</html>
