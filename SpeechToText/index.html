        document.addEventListener("DOMContentLoaded", async () => {
            const transcriptDisplay = document.getElementById("transcript");
            const API_KEY = "3896ab0e7e50980788cf3bb4d9a539f876745387";
            const audioFilePath = "/home/thiru-zstk368/Downloads/Voice_002.m4a";
            const response = await fetch(audioFilePath);
            const audioBlob = await response.blob();
            const formData = new FormData();
            formData.append("audio", audioBlob, "Voice_002.m4a");
            const deepgramResponse = await fetch("https://api.deepgram.com/v1/listen", {
                method: "POST",
                headers: {
                    "Authorization": `Token ${API_KEY}`
                },
                body: formData
            });

            const result = await deepgramResponse.json();
            transcriptDisplay.innerText = result.results?.channels[0]?.alternatives[0]?.transcript || "No speech detected.";
