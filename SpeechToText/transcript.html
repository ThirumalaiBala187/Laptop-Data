<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
</head>
<body>
    <h2>Upload Audio and Convert to Text</h2>
    <input type="file" id="audioFile" accept="audio/*">
    <button id="upload">Upload & Transcribe</button>
    <p><strong>Transcription:</strong></p>
    <p id="transcript">Waiting for input...</p>

    <script>
        document.getElementById("upload").addEventListener("click", async () => {
            const fileInput = document.getElementById("audioFile");
            const transcriptDisplay = document.getElementById("transcript");

            if (fileInput.files.length === 0) {
                alert("Please select an audio file first.");
                return;
            }

            const audioBlob = fileInput.files[0];
            console.log("File Type:", audioBlob.type);
            console.log("File Size:", audioBlob.size, "bytes");

            if (audioBlob.size === 0) {
                alert("The selected audio file is empty.");
                return;
            }

            const API_KEY = "3896ab0e7e50980788cf3bb4d9a539f876745387";
            const formData = new FormData();
            formData.append("audio", audioBlob);

            try {
                const response = await fetch("https://api.deepgram.com/v1/listen?model=whisper", {
                    method: "POST",
                    headers: {
                        "Authorization": `Token ${API_KEY}`
                    },
                    body: formData
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(`Deepgram API error: ${JSON.stringify(result)}`);
                }

                transcriptDisplay.innerText = result.results?.channels[0]?.alternatives[0]?.transcript || "No speech detected.";
            } catch (error) {
                console.error("Deepgram Error:", error);
                transcriptDisplay.innerText = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
