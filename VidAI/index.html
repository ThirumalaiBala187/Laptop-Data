<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vid AI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea, button { display: block; margin: 10px 0; }
        #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Vid AI</h1>
    <textarea id="inputText" rows="4" cols="50" placeholder="Enter your text here..."></textarea>
    <button onclick="generateText()">Generate</button>
    <div id="output"></div>

    <script>
        async function generateText() {
            const inputText = document.getElementById('inputText').value.trim();
            const outputDiv = document.getElementById('output');

            if (!inputText) {
                outputDiv.innerHTML = '<p style="color: red;">Please enter some text!</p>';
                return;
            }

            outputDiv.innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch('https://75f5-34-168-218-126.ngrok-free.app/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: inputText }),
                });

                const data = await response.json();

                if (response.ok) {
                    console.log(data.response)
                    outputDiv.innerText = data.response;
                } else {
                    outputDiv.innerHTML = `<p style="color: red;">Error: ${data.error} (Status: ${response.status})</p>`;
                }
            } catch (error) {
                outputDiv.innerHTML = `<p style="color: red;">Network Error: ${error.message}</p>`;
                console.error('Fetch failed:', error);
            }
        }
    </script>
</body>
</html>
