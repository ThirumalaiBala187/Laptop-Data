<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gray Scaler</title>
    <script src="http://www.dukelearntoprogram.com/course1/common/js/image/SimpleImage.js"></script>
    <link rel="stylesheet" href="GreyScaler.css" type="text/css">
    <link rel="icon" href="greyScalerLogo.png" type="image/png">
</head>
<body>
    <div class="bg">
        <h1 style="color:lightgray"><u>Make your Images to Gray</u></h1>
        <div class="canvasBox">
            <div class="canvasBoxInner">
                <canvas id="display"></canvas>
                <input type="file" id="upload"></input>
                <button id="button">Make Grey</button>
            </div>
            <div class="canvasBoxInner">
                <canvas id="result"></canvas>
                <button id="button" onclick="clearCanvas()">Reset Image</button>
            </div>
        </div>

    </div>

    
 

    <script src="GreyScaler.js"></script>
    
</body>
</html>
