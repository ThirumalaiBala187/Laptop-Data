<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up Page</title>
  <script src="https://kit.fontawesome.com/82e94ecea6.js" crossorigin="anonymous"></script>
  <link rel="icon" href="ZCLogo1.png" type="image/png">
  <script src="https://accounts.google.com/gsi/client"></script>
  <link rel="stylesheet" href="signup.css" type="text/css">
</head>
<body>
	<div class="background">
		<ul class="circles">
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
		</ul>
	</div>
  
  <div class="container">
    <h2>Sign Up</h2>
    
    <div class="form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
      <i class="fa-solid fa-user icon"></i>
    </div>
    
    <div class="form">
      <label for="username">Email or Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required>
      <i class="fa-solid fa-at icon"></i>
    </div>
    
    <div class="form">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required>
      <span class="input-icon" id="toggle" onclick="togglePassword()">
      	 <i	class="fa-solid fa-eye icon"></i>
      </span>
    </div>
    
    <div class="form">
      <label for="mobile">Mobile</label>
      <input type="text" id="mobile" name="mobile" placeholder="Your Mobile" value="+91" required>
      <i class="fa-solid fa-phone-volume icon"></i>
    </div>
    
    <div class="form">
      <label for="age">Date of Birth</label>
      <input type="date" id="dob" name="dob" placeholder="Date of Birth">
    </div>
    
    <div class="form">
      <label>Gender</label>
      <div class="gender">
        <div class="option">
          <input type="radio" id="male" name="gender" value="Male" checked>
          <label for="male">Male</label>
        </div>
        <div class="option">
          <input type="radio" id="female" name="gender" value="Female">
          <label for="female">Female</label>
        </div>
        <div class="option">
          <input type="radio" id="other" name="gender" value="Others">
          <label for="other">Other</label>
        </div>
      </div>
    </div>
    
    <button id="submit">Sign Up</button>
    
    <div class="link">
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
    
    <div id="g_id_onload"
	     data-client_id="1009662778393-b78mu9sr4idd4kp8ojdhbj5jedf5oeb4.apps.googleusercontent.com"
	     data-callback="handleCredentialResponse"
	     data-auto_prompt="true" style="margin-top: 25px">
	</div>
	<div class="g_id_signin" data-type="standard"></div>
  	
  </div>

  <script src="signup.js"></script>

</body>
</html>
