<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<link rel="icon" href="ZCLogo1.png" type="image/png">
<script src="https://kit.fontawesome.com/82e94ecea6.js"
	crossorigin="anonymous"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="login.css" type="text/css">
</head>
<body>
	<div class="background">
		<ul class="circles">
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
			<li></li>
		</ul>
	</div>

	<div class="container">
		<div class="header">
			<h1>Sign In</h1>
		</div>

		<div class="form">
			<label for="username">Email or Username</label> <input type="text"
				id="username" name="username" placeholder="Enter your username"
				required>
		</div>

		<div class="form">
			<label for="password">Password</label>
			<div class="field">
				<input type="password" id="password" name="password" placeholder="Enter your password" required> 
				<span class="toggle" onclick="togglePassword()">
				<i class="fa-solid fa-eye"></i>
				</span>
			</div>
		</div>

		<!--  <div class="remember">
			<input type="checkbox" id="remember" name="remember"> <label
				for="remember">Remember me</label>
		</div>  -->

		<button id="submit">Sign In</button>

		<div class="footer">
			<p>
			<!-- <p>
				<a href="#">Forgot password?</a>
			</p> -->
				Don't have an account? <a href="signup.html">Create account</a>
			</p>
			<!-- <p>
				<a href="#">Forgot password?</a>
			</p> -->
		</div>
		
		<div id="g_id_onload"
		     data-client_id="1009662778393-b78mu9sr4idd4kp8ojdhbj5jedf5oeb4.apps.googleusercontent.com"
		     data-callback="handleCredentialResponse"
		     data-auto_prompt="true" style="margin-top: 25px">
		</div>
		<div class="g_id_signin" data-type="standard"></div>
	
	</div>

	<script src="login.js"></script>
</body>
</html>
